<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 890" width="1040" height="890" style="display:block;width:100%;height:auto;max-width:1040px" role="img" aria-labelledby="title desc">
<title id="title">Three ToF sensors · one I²C bus</title>
<desc id="desc">All three VL53L0X sensors share ESP32-C6 3V3 to VIN, GND to GND, GPIO6 to SDA and GPIO7 to SCL. Each has an independent XSHUT connection: left GPIO18 at address 0x30, front GPIO19 at 0x31, right GPIO20 at 0x29. On every boot firmware shuts down all sensors then enables and addresses left, front, right in order. Logical connections, not physical pin positions.</desc>
<!-- Logical connections only. Authority: micromouse-debug-kit sketch header comments. -->
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#18332b}
.title{font-size:34px;font-weight:700;letter-spacing:-.5px}
.section{font-size:24px;font-weight:700}
.body{font-size:22px}
.small{font-size:19px;fill:#53665f}
.mono{font-family:Consolas,'Liberation Mono',monospace;font-size:22px;font-weight:700}
.kicker{font-size:17px;font-weight:700;letter-spacing:2px;fill:#16734b}
.green{font-size:22px;font-weight:700;fill:#16734b}
.red{font-size:22px;font-weight:700;fill:#b53640}
</style>
<rect width="1040" height="890" rx="24" fill="#f7faf7"/>
<rect x="40" y="34" width="6" height="62" rx="3" fill="#16734b"/>
<text x="62" y="49" class="kicker" >VL53L0X / LEFT + FRONT + RIGHT</text>
<text x="62" y="91" class="title" >Three ToF sensors · one I²C bus</text>
<text x="40" y="127" class="small" >Logical connections • GPIO numbers are not physical header positions.</text>
<rect x="40" y="165" width="310" height="300" rx="18" fill="#fff" stroke="#cbdcd2" stroke-width="1.5"/>
<rect x="690" y="165" width="310" height="300" rx="18" fill="#fff" stroke="#cbdcd2" stroke-width="1.5"/>
<text x="65" y="208" class="section" >ESP32-C6</text>
<text x="715" y="208" class="section" >EACH ToF sensor</text>
<text x="325" y="267" class="mono" text-anchor="end">3V3</text>
<text x="715" y="267" class="mono" >VIN</text>
<path d="M350 260 H690" fill="none" stroke="#b53640" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="350" cy="260" r="5" fill="#b53640"/>
<circle cx="690" cy="260" r="5" fill="#b53640"/>
<text x="520" y="248" class="small" text-anchor="middle">Shared 3.3 V</text>
<text x="325" y="322" class="mono" text-anchor="end">GND</text>
<text x="715" y="322" class="mono" >GND</text>
<path d="M350 315 H690" fill="none" stroke="#65746e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="350" cy="315" r="5" fill="#65746e"/>
<circle cx="690" cy="315" r="5" fill="#65746e"/>
<text x="520" y="303" class="small" text-anchor="middle">Shared ground</text>
<text x="325" y="377" class="mono" text-anchor="end">GPIO6</text>
<text x="715" y="377" class="mono" >SDA</text>
<path d="M350 370 H690" fill="none" stroke="#16734b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="350" cy="370" r="5" fill="#16734b"/>
<circle cx="690" cy="370" r="5" fill="#16734b"/>
<text x="520" y="358" class="small" text-anchor="middle">Shared I²C data</text>
<text x="325" y="432" class="mono" text-anchor="end">GPIO7</text>
<text x="715" y="432" class="mono" >SCL</text>
<path d="M350 425 H690" fill="none" stroke="#16734b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="350" cy="425" r="5" fill="#16734b"/>
<circle cx="690" cy="425" r="5" fill="#16734b"/>
<text x="520" y="413" class="small" text-anchor="middle">Shared I²C clock</text>
<text x="40" y="500" class="body" >Repeat these four connections for LEFT, FRONT and RIGHT.</text>
<rect x="40" y="525" width="300" height="180" rx="18" fill="#edf7f0" stroke="#cbdcd2" stroke-width="1.5"/>
<text x="62" y="563" class="section" >LEFT</text>
<text x="62" y="603" class="mono" >GPIO18</text>
<path d="M163 596 H214" fill="none" stroke="#16734b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="229" y="603" class="mono" >XSHUT</text>
<text x="62" y="654" class="mono" >Address 0x30</text>
<text x="62" y="685" class="small" >Independent shutdown wire</text>
<rect x="370" y="525" width="300" height="180" rx="18" fill="#edf7f0" stroke="#cbdcd2" stroke-width="1.5"/>
<text x="392" y="563" class="section" >FRONT</text>
<text x="392" y="603" class="mono" >GPIO19</text>
<path d="M493 596 H544" fill="none" stroke="#16734b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="559" y="603" class="mono" >XSHUT</text>
<text x="392" y="654" class="mono" >Address 0x31</text>
<text x="392" y="685" class="small" >Independent shutdown wire</text>
<rect x="700" y="525" width="300" height="180" rx="18" fill="#edf7f0" stroke="#cbdcd2" stroke-width="1.5"/>
<text x="722" y="563" class="section" >RIGHT</text>
<text x="722" y="603" class="mono" >GPIO20</text>
<path d="M823 596 H874" fill="none" stroke="#16734b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="889" y="603" class="mono" >XSHUT</text>
<text x="722" y="654" class="mono" >Address 0x29</text>
<text x="722" y="685" class="small" >Independent shutdown wire</text>
<rect x="40" y="730" width="960" height="95" rx="18" fill="#fff" stroke="#cbdcd2" stroke-width="1.5"/>
<text x="62" y="764" class="body" >Every boot: all XSHUT LOW → enable LEFT, set 0x30</text>
<text x="62" y="800" class="body" >→ enable FRONT, set 0x31 → enable RIGHT, keep 0x29.</text>
<text x="40" y="865" class="small" >Source: 05_tof_3 + 06_tof_3_imu headers</text>
</svg>
