<text x="715" y="377" class="mono" >DIR2</text>
<path d="M350 370 H690" fill="none" stroke="#16734b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="350" cy="370" r="5" fill="#16734b"/>
