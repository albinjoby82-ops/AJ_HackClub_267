<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1090" width="1040" height="1090" style="display:block;width:100%;height:auto;max-width:1040px" role="img" aria-labelledby="title desc">
<title id="title">Motor driver · two channels</title>
<desc id="desc">ESP32-C6 GPIO0 to DIR1, GPIO2 to PWM1, GPIO3 to DIR2 and GPIO10 to PWM2. Motor A outputs go to the left motor, Motor B outputs to the right motor. Battery positive 9V to VM. Battery negative, driver GND and ESP32 GND are joined. Driver VCC connects to ESP32 3V3 only if that pin exists. PWM maximum 170/255. Motor A encoder C1 to GPIO21, C2 to GPIO22, VCC to 3V3 and GND to GND. Logical connections, not physical terminal positions.</desc>
<!-- Logical connections only. Authority: micromouse-debug-kit sketch header comments. -->
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#18332b}
.title{font-size:34px;font-weight:700;letter-spacing:-.5px}
.section{font-size:24px;font-weight:700}
.body{font-size:22px}
.small{font-size:19px;fill:#53665f}
.mono{font-family:Consolas,'Liberation Mono',monospace;font-size:22px;font-weight:700}
.kicker{font-size:17px;font-weight:700;letter-spacing:2px;fill:#16734b}
.green{font-size:22px;font-weight:700;fill:#16734b}
.red{font-size:22px;font-weight:700;fill:#b53640}
</style>
<rect width="1040" height="1090" rx="24" fill="#f7faf7"/>
