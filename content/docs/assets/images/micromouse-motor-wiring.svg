<text x="62" y="522" class="section" >Motor A outputs → LEFT motor</text>
<text x="62" y="565" class="small" >Connect the two motor power wires.</text>
<text x="552" y="522" class="section" >Motor B outputs → RIGHT motor</text>
<text x="552" y="565" class="small" >Connect the two motor power wires.</text>
<rect x="40" y="620" width="960" height="185" rx="18" fill="#fff" stroke="#cbdcd2" stroke-width="1.5"/>
<text x="62" y="660" class="section" >Driver power</text>
<text x="62" y="702" class="mono" >Battery +9V → VM</text>
<text x="460" y="702" class="body" >Battery − = driver GND = ESP32 GND</text>
<text x="62" y="746" class="body" >ESP32 3V3 → VCC only if your driver board has a VCC pin.</text>
<text x="62" y="782" class="small" >USB powers the ESP32-C6. Battery powers the motors through the driver.</text>
<rect x="40" y="825" width="960" height="150" rx="18" fill="#fff" stroke="#cbdcd2" stroke-width="1.5"/>
<text x="62" y="865" class="section" >Motor A encoder · separate from the motor power wires</text>
<text x="62" y="910" class="mono" >C1 → GPIO21    C2 → GPIO22</text>
<text x="62" y="949" class="mono" >VCC → ESP32 3V3    GND → ESP32 GND</text>
<text x="40" y="1018" class="red" >PWM maximum: 170/255 • Keep this firmware speed cap.</text>
<text x="40" y="1065" class="small" >Source: 07_motor_1 + 08_motors_2 + tools/encoder_test headers</text>
</svg>
