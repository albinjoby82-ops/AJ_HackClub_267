<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 930" width="1040" height="930" style="display:block;width:100%;height:auto;max-width:1040px" role="img" aria-labelledby="title desc">
<title id="title">Power flow · USB + 9 V battery</title>
<desc id="desc">USB powers the ESP32-C6 controller. Its 3V3 output supplies the MPU6050, all three VL53L0X sensors and the Motor A encoder. Optional driver VCC receives 3V3 only if the board has that pin. A separate 9V battery positive connects to motor driver VM, and the driver Motor A and Motor B outputs power the left and right motors. Battery negative, driver ground, controller ground and all sensor and encoder grounds are common. PWM is capped at 170/255. The legacy filename does not describe this circuit; no buck converter or two-cell supply is specified.</desc>
