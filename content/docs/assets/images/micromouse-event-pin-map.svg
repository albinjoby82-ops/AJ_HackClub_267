<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1120" width="1040" height="1120" style="display:block;width:100%;height:auto;max-width:1040px" role="img" aria-labelledby="title desc">
<title id="title">Micromouse · event pin map</title>
<desc id="desc">Complete ESP32-C6 logical pin assignments. GPIO6 SDA and GPIO7 SCL shared by MPU6050 and three VL53L0X sensors; all sensors use 3V3 and GND. ToF XSHUT left GPIO18 address 0x30, front GPIO19 address 0x31, right GPIO20 address 0x29. Driver DIR1 GPIO0, PWM1 GPIO2, DIR2 GPIO3, PWM2 GPIO10; Motor A left, Motor B right. Motor A encoder C1 GPIO21, C2 GPIO22, VCC 3V3, GND. Onboard RGB GPIO8 needs no wire. IMU XDA XCL AD0 INT unconnected. USB controller power; 9V battery positive to driver VM; common battery negative, driver and ESP32 ground. Optional driver VCC to 3V3 only if present. Maximum PWM 170/255.</desc>
<!-- Logical connections only. Authority: micromouse-debug-kit sketch header comments. -->
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#18332b}
.title{font-size:34px;font-weight:700;letter-spacing:-.5px}
.section{font-size:24px;font-weight:700}
.body{font-size:22px}
.small{font-size:19px;fill:#53665f}
.mono{font-family:Consolas,'Liberation Mono',monospace;font-size:22px;font-weight:700}
.kicker{font-size:17px;font-weight:700;letter-spacing:2px;fill:#16734b}
.green{font-size:22px;font-weight:700;fill:#16734b}
.red{font-size:22px;font-weight:700;fill:#b53640}
</style>
<rect width="1040" height="1120" rx="24" fill="#f7faf7"/>
<rect x="40" y="34" width="6" height="62" rx="3" fill="#16734b"/>
<text x="62" y="49" class="kicker" >ESP32-C6 / QUICK REFERENCE</text>
<text x="62" y="91" class="title" >Micromouse · event pin map</text>
<text x="40" y="127" class="small" >Logical connections • GPIO numbers are not physical header positions.</text>
<rect x="40" y="155" width="470" height="230" rx="18" fill="#fff" stroke="#cbdcd2" stroke-width="1.5"/>
<rect x="530" y="155" width="470" height="230" rx="18" fill="#fff" stroke="#cbdcd2" stroke-width="1.5"/>
<text x="62" y="193" class="section" >Shared I²C · all four sensors</text>
<text x="62" y="233" class="mono" >GPIO6 → SDA</text>
<text x="62" y="268" class="mono" >GPIO7 → SCL</text>
<text x="62" y="309" class="body" >3V3 → IMU VCC / ToF VIN</text>
<text x="62" y="345" class="body" >GND → every sensor GND</text>
<text x="552" y="193" class="section" >ToF · separate XSHUT wires</text>
<text x="552" y="235" class="green" >LEFT</text>
<text x="670" y="235" class="mono" >GPIO18</text>
<text x="875" y="235" class="mono" >0x30</text>
<text x="552" y="279" class="green" >FRONT</text>
<text x="670" y="279" class="mono" >GPIO19</text>
<text x="875" y="279" class="mono" >0x31</text>
<text x="552" y="323" class="green" >RIGHT</text>
<text x="670" y="323" class="mono" >GPIO20</text>
<text x="875" y="323" class="mono" >0x29</text>
<text x="552" y="363" class="small" >Addresses after firmware initialization.</text>
<rect x="40" y="405" width="470" height="295" rx="18" fill="#fff" stroke="#cbdcd2" stroke-width="1.5"/>
<rect x="530" y="405" width="470" height="295" rx="18" fill="#fff" stroke="#cbdcd2" stroke-width="1.5"/>
<text x="62" y="445" class="section" >Motor driver · direction + PWM</text>
<text x="62" y="490" class="mono" >GPIO0 → DIR1</text>
<text x="375" y="490" class="small" >A / left</text>
<text x="62" y="534" class="mono" >GPIO2 → PWM1</text>
<text x="375" y="534" class="small" >A / left</text>
<text x="62" y="578" class="mono" >GPIO3 → DIR2</text>
<text x="375" y="578" class="small" >B / right</text>
<text x="62" y="622" class="mono" >GPIO10 → PWM2</text>
<text x="375" y="622" class="small" >B / right</text>
<text x="62" y="674" class="red" >PWM limit: 170/255</text>
<text x="552" y="445" class="section" >Motor A encoder · left</text>
<text x="552" y="492" class="mono" >GPIO21 ← C1</text>
<text x="552" y="536" class="mono" >GPIO22 ← C2</text>
<text x="552" y="580" class="body" >3V3 → encoder VCC</text>
<text x="552" y="622" class="body" >GND → encoder GND</text>
<text x="552" y="674" class="red" >Encoder power is 3V3.</text>
<rect x="40" y="720" width="470" height="155" rx="18" fill="#edf7f0" stroke="#cbdcd2" stroke-width="1.5"/>
<rect x="530" y="720" width="470" height="155" rx="18" fill="#fff0ef" stroke="#cbdcd2" stroke-width="1.5"/>
<text x="62" y="758" class="section" >Onboard RGB LED</text>
<text x="62" y="802" class="mono" >GPIO8 · built into the board</text>
<text x="62" y="843" class="body" >No external wire.</text>
<text x="552" y="758" class="section" >MPU6050 / GY-521</text>
<text x="552" y="802" class="mono" >XDA · XCL · AD0 · INT</text>
<text x="552" y="843" class="red" >Leave all four UNCONNECTED.</text>
<rect x="40" y="895" width="960" height="155" rx="18" fill="#fff" stroke="#cbdcd2" stroke-width="1.5"/>
<text x="62" y="933" class="section" >Power · USB controller + 9 V motor battery</text>
<text x="62" y="972" class="body" >Battery +9V → driver VM    •    Motor A → left    •    Motor B → right</text>
<text x="62" y="1007" class="body" >Battery − = driver GND = ESP32 GND = sensor / encoder GND</text>
<text x="62" y="1036" class="small" >Driver VCC → ESP32 3V3 only if your driver board has a VCC pin.</text>
<text x="40" y="1095" class="small" >Source: debug-kit headers · steps 01–08 + tools/encoder_test</text>
</svg>
