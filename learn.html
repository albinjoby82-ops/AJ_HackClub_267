<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learn — Hack Club Build Hub</title>
<link rel="stylesheet" href="design-tokens.css">
<link rel="stylesheet" href="site.css">
</head>
<body>

<div class="topbar">
    <div class="topbar-inner">
        <a class="wordmark" href="index.html"><img class="brand-flag" src="https://assets.hackclub.com/flag-standalone.svg" alt="">Build Hub <span class="mono-sub">Hack Club</span></a>
        <nav class="topbar-nav">
            <button class="menu-toggle" id="menuToggle">☰ MENU</button>
            <a href="index.html">Home</a>
            <a href="micromouse.html" class="event-nav">Micromouse 2026</a>
            <a href="learn.html?scope=workshops" id="workshopsNav">Workshops</a>
            <a href="learn.html?scope=wiki" id="wikiNav">Wiki</a>
            <a href="videos.html">Videos</a>
            <a href="media.html">Assets</a>
        </nav>
    </div>
</div>

<div class="learn-shell">
    <aside class="sidebar" id="sidebar">
        <label class="search-mini">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3E5C68" stroke-width="2" stroke-linecap="round">
                <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
            </svg>
            <input type="search" id="navSearch" placeholder="Search workshops & guides…">
        </label>
        <a class="sidebar-title" id="sidebarTitle" href="#"></a>
        <button class="nav-collapse-all" id="toggleNav" type="button">EXPAND ALL</button>
        <nav class="nav-tree" id="navTree"></nav>
    </aside>

    <main class="content-pane">
        <div class="breadcrumb" id="breadcrumb"></div>
        <article class="md" id="content"></article>
        <nav class="pager" id="pager"></nav>
    </main>
</div>

<script src="content/content.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
(function () {
    'use strict';

    var allPages = (window.SITE_CONTENT && window.SITE_CONTENT.pages) || {};
    var params = new URLSearchParams(location.search);
    var scope = params.get('scope') === 'wiki' ? 'wiki' : 'workshops';
    var scopePrefix = scope === 'wiki' ? 'docs/Wiki/' : 'docs/Workshops/';
    var pages = {};

    Object.keys(allPages).forEach(function (path) {
        if (path.indexOf(scopePrefix) === 0) pages[path] = allPages[path];
    });

    document.title = (scope === 'wiki' ? 'Wiki' : 'Workshops') + ' — Hack Club Build Hub';
    document.getElementById(scope === 'wiki' ? 'wikiNav' : 'workshopsNav').classList.add('is-active');
    var scopeRootPath = scope === 'wiki' ? 'docs/Wiki/index.md' : null;
    var sidebarTitle = document.getElementById('sidebarTitle');
    sidebarTitle.textContent = scope === 'wiki' ? 'Wiki' : 'Workshops';
    sidebarTitle.href = scopeRootPath ? '#/' + scopeRootPath : 'learn.html?scope=workshops';
    document.getElementById('navSearch').placeholder =
        scope === 'wiki' ? 'Search the wiki…' : 'Search workshops…';

    /* ---------- build the tree ---------- */

    var byTitle = {};
    Object.keys(pages).forEach(function (path) { byTitle[pages[path].title] = path; });

    var children = {};
    var roots = [];
    Object.keys(pages).forEach(function (path) {
        var p = pages[path];
        var parentPath = p.parent ? byTitle[p.parent] : null;
        if (parentPath && parentPath !== path) {
            (children[parentPath] = children[parentPath] || []).push(path);
        } else {
            roots.push(path);
        }
    });

    function byOrder(a, b) {
        var d = pages[a].order - pages[b].order;
        return d !== 0 ? d : pages[a].title.localeCompare(pages[b].title);
    }
    roots.sort(byOrder);
    Object.keys(children).forEach(function (k) { children[k].sort(byOrder); });

    /* flatten in reading order for prev/next */
    var flat = [];
    (function walk(list) {
        list.forEach(function (p) {
            flat.push(p);
            if (children[p]) walk(children[p]);
        });
    })(roots);

    /* ---------- sidebar ---------- */

    var navTree = document.getElementById('navTree');

    function navLink(path) {
        var a = document.createElement('a');
        a.href = '#/' + path;
        a.textContent = pages[path].title;
        a.dataset.path = path;
        return a;
    }

    function navBranch(path, level) {
        var branchChildren = children[path] || [];
        if (!branchChildren.length) {
            var leaf = navLink(path);
            leaf.style.setProperty('--nav-depth', level);
            return leaf;
        }

        var det = document.createElement('details');
        det.dataset.root = path;
        det.style.setProperty('--nav-depth', level);

        var sum = document.createElement('summary');
        var label = navLink(path);
        label.addEventListener('click', function (e) {
            e.stopPropagation();
            det.open = true;
        });
        sum.appendChild(label);
        det.appendChild(sum);

        var nested = document.createElement('div');
        nested.className = 'nav-children';
        branchChildren.forEach(function (child) {
            nested.appendChild(navBranch(child, level + 1));
        });
        det.appendChild(nested);
        return det;
    }

    function buildNav() {
        navTree.innerHTML = '';
        roots.forEach(function (root) {
            if (root === scopeRootPath && children[root]) {
                children[root].forEach(function (child) {
                    navTree.appendChild(navBranch(child, 0));
                });
            } else {
                navTree.appendChild(navBranch(root, 0));
            }
        });
    }
    buildNav();

    var toggleNav = document.getElementById('toggleNav');

    function updateToggleNav() {
        var branches = Array.from(navTree.querySelectorAll('details'));
        var allOpen = branches.length > 0 && branches.every(function (det) { return det.open; });
        toggleNav.textContent = allOpen ? 'COLLAPSE ALL' : 'EXPAND ALL';
        toggleNav.setAttribute('aria-label', allOpen ? 'Collapse all navigation sections' : 'Expand all navigation sections');
    }

    toggleNav.addEventListener('click', function () {
        var branches = Array.from(navTree.querySelectorAll('details'));
        var allOpen = branches.length > 0 && branches.every(function (det) { return det.open; });
        branches.forEach(function (det) { det.open = !allOpen; });
        updateToggleNav();
    });
    navTree.addEventListener('toggle', updateToggleNav, true);
    updateToggleNav();

    /* ---------- callout transform (Jekyll just-the-docs syntax) ---------- */

    var CALLOUTS = {
        warning: '⚠️ Warning!',
        troubleshooting: '😵‍💫 Troubleshooting…',
        tip: '💡 Tip!',
        challenge: '💪 Challenge!',
        'try': '🤔 Try it!',
        think: '🧠 Think!',
        extra: '🤓 Umm actually..',
        note: '📌 Note'
    };
    var ATTR_RE = /^\{:\s*\.([A-Za-z]+)(-title)?\s*!?\s*\}\s*$/;

    function calloutHtml(type, titled, quoteLines) {
        var inner = quoteLines.map(function (l) { return l.replace(/^>\s?/, ''); });
        var title = CALLOUTS[type] || type;
        if (titled && inner.length) {
            title = inner.shift().trim();
            while (inner.length && inner[0].trim() === '') inner.shift();
        }
        var bodyHtml = marked.parse(inner.join('\n'));
        var titleHtml = marked.parseInline(title);
        return '<div class="callout callout-' + type + '">' +
            '<div class="callout-title">' + titleHtml + '</div>' +
            '<div class="callout-body">' + bodyHtml + '</div></div>';
    }

    function transformCallouts(md) {
        var lines = md.split('\n');
        var out = [];
        var i = 0;
        while (i < lines.length) {
            var m = lines[i].match(ATTR_RE);
            if (m) {
                var type = m[1].toLowerCase();
                /* look ahead past blank lines for a blockquote */
                var j = i + 1;
                while (j < lines.length && lines[j].trim() === '') j++;
                if (CALLOUTS[type] && j < lines.length && /^>/.test(lines[j])) {
                    var quote = [];
                    while (j < lines.length && (/^>/.test(lines[j]) || lines[j].trim() === '')) {
                        if (lines[j].trim() === '' && !(j + 1 < lines.length && /^>/.test(lines[j + 1]))) break;
                        quote.push(lines[j]);
                        j++;
                    }
                    out.push('', calloutHtml(type, !!m[2], quote.filter(function (l) { return /^>/.test(l); })), '');
                    i = j;
                    continue;
                }
                /* attribute after a blockquote we already emitted as plain md:
                   rewind — find trailing quote block in `out` */
                var end = out.length;
                while (end > 0 && out[end - 1].trim() === '') end--;
                var start = end;
                while (start > 0 && /^>/.test(out[start - 1])) start--;
                if (CALLOUTS[type] && start < end) {
                    var q = out.splice(start, end - start);
                    out.push(calloutHtml(type, !!m[2], q), '');
                    i++;
                    continue;
                }
                /* unknown / orphan attribute line — drop it */
                i++;
                continue;
            }
            out.push(lines[i]);
            i++;
        }
        return out.join('\n');
    }

    /* ---------- relative link / image fixing ---------- */

    function resolvePath(dir, rel) {
        var parts = (dir ? dir.split('/') : []).concat(rel.split('/'));
        var stack = [];
        parts.forEach(function (p) {
            if (p === '' || p === '.') return;
            if (p === '..') stack.pop(); else stack.push(p);
        });
        return stack.join('/');
    }

    function fixRelative(container, pagePath) {
        var dir = pagePath.indexOf('/') >= 0 ? pagePath.slice(0, pagePath.lastIndexOf('/')) : '';
        container.querySelectorAll('img[src]').forEach(function (img) {
            var src = img.getAttribute('src');
            if (!/^([a-z]+:|\/|#|data:)/i.test(src)) {
                img.setAttribute('src', 'content/' + resolvePath(dir, src));
            }
        });
        container.querySelectorAll('a[href]').forEach(function (a) {
            var href = a.getAttribute('href');
            if (/^([a-z]+:|\/|#)/i.test(href)) {
                if (/^https?:/i.test(href)) { a.target = '_blank'; a.rel = 'noopener'; }
                return;
            }
            var resolved = resolvePath(dir, href.split('#')[0]);
            if (/\.md$/i.test(resolved) && pages[resolved]) {
                a.setAttribute('href', '#/' + resolved);
            } else {
                a.setAttribute('href', 'content/' + resolved);
                a.target = '_blank';
                a.rel = 'noopener';
            }
        });
    }

    /* ---------- copy buttons ---------- */

    function addCopyButtons(container) {
        container.querySelectorAll('pre').forEach(function (pre) {
            var btn = document.createElement('button');
            btn.className = 'copy-btn';
            btn.textContent = 'COPY';
            btn.addEventListener('click', function () {
                var code = pre.querySelector('code');
                navigator.clipboard.writeText(code ? code.innerText : pre.innerText).then(function () {
                    btn.textContent = 'COPIED';
                    setTimeout(function () { btn.textContent = 'COPY'; }, 1500);
                });
            });
            pre.appendChild(btn);
        });
    }

    /* ---------- rendering ---------- */

    var content = document.getElementById('content');
    var breadcrumb = document.getElementById('breadcrumb');
    var pager = document.getElementById('pager');

    function crumbFor(path) {
        var trail = [];
        var p = pages[path];
        while (p) {
            trail.unshift(p.title);
            p = p.parent && byTitle[p.parent] && byTitle[p.parent] !== path ? pages[byTitle[p.parent]] : null;
        }
        return trail;
    }

    function setActive(path) {
        navTree.querySelectorAll('a').forEach(function (a) {
            a.classList.toggle('is-active', a.dataset.path === path);
        });
        /* open the section containing the page */
        navTree.querySelectorAll('details').forEach(function (det) {
            if (det.querySelector('a[data-path="' + path + '"]') || det.dataset.root === path) det.open = true;
        });
    }

    function renderPage(path) {
        var page = pages[path];
        if (!page) { renderNotFound(path); return; }

        var html;
        if (typeof marked !== 'undefined') {
            html = marked.parse(transformCallouts(page.body));
        } else {
            html = '<pre style="white-space:pre-wrap">' + page.body.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre>';
        }
        content.className = 'md';
        content.innerHTML = html;
        fixRelative(content, path);
        addCopyButtons(content);

        breadcrumb.innerHTML = crumbFor(path).map(function (t, idx, arr) {
            return idx === arr.length - 1 ? t : '<a href="#/' + byTitle[t] + '">' + t + '</a> / ';
        }).join('');

        var idx = flat.indexOf(path);
        pager.innerHTML = '';
        if (idx > 0) {
            pager.innerHTML += '<a href="#/' + flat[idx - 1] + '"><span>← Previous</span>' + pages[flat[idx - 1]].title + '</a>';
        } else {
            pager.innerHTML += '<span></span>';
        }
        if (idx >= 0 && idx < flat.length - 1) {
            pager.innerHTML += '<a href="#/' + flat[idx + 1] + '" style="text-align:right;margin-left:auto"><span>Next →</span>' + pages[flat[idx + 1]].title + '</a>';
        }

        setActive(path);
        document.title = page.title + ' — Hack Club Build Hub';
        window.scrollTo(0, 0);
        closeSidebar();
    }

    function renderNotFound(path) {
        content.className = 'md';
        content.innerHTML = '<h1>Page not found</h1><p>No page at <code>' + path + '</code>. Pick a section from the menu.</p>';
        breadcrumb.textContent = '';
        pager.innerHTML = '';
    }

    /* ---------- search ---------- */

    var plainCache = {};
    function plainText(path) {
        if (!plainCache[path]) {
            plainCache[path] = pages[path].body
                .replace(/```[\s\S]*?```/g, ' ')
                .replace(/\{:[^}]*\}/g, ' ')
                .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ')
                .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
                .replace(/<[^>]+>/g, ' ')
                .replace(/[#>*_`|-]+/g, ' ')
                .replace(/\s+/g, ' ');
        }
        return plainCache[path];
    }

    function escapeHtml(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function renderSearch(query) {
        var q = query.trim();
        document.getElementById('navSearch').value = q;
        var terms = q.toLowerCase().split(/\s+/).filter(Boolean);
        var results = [];

        if (terms.length) {
            Object.keys(pages).forEach(function (path) {
                var title = pages[path].title.toLowerCase();
                var text = plainText(path).toLowerCase();
                var score = 0;
                var ok = terms.every(function (t) {
                    var inTitle = title.indexOf(t) >= 0;
                    var inBody = text.indexOf(t) >= 0;
                    if (inTitle) score += 10;
                    if (inBody) score += 1;
                    return inTitle || inBody;
                });
                if (ok) results.push({ path: path, score: score });
            });
            results.sort(function (a, b) { return b.score - a.score; });
        }

        content.className = 'search-results';
        breadcrumb.textContent = '';
        pager.innerHTML = '';
        document.title = 'Search — Hack Club Build Hub';

        var html = '<h1>Search</h1><div class="result-count">' + results.length +
            ' result' + (results.length === 1 ? '' : 's') + ' for “' + escapeHtml(q) + '”</div>';

        results.forEach(function (r) {
            var text = plainText(r.path);
            var lower = text.toLowerCase();
            var pos = lower.indexOf(terms[0]);
            var snippet = '';
            if (pos >= 0) {
                var from = Math.max(0, pos - 70);
                snippet = (from > 0 ? '…' : '') + text.slice(from, pos + 90) + '…';
                snippet = escapeHtml(snippet);
                terms.forEach(function (t) {
                    snippet = snippet.replace(new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>');
                });
            }
            html += '<a class="result" href="#/' + r.path + '">' +
                '<div class="r-crumb">' + escapeHtml(crumbFor(r.path).slice(0, -1).join(' / ') || 'Build Hub') + '</div>' +
                '<div class="r-title">' + escapeHtml(pages[r.path].title) + '</div>' +
                (snippet ? '<div class="r-snippet">' + snippet + '</div>' : '') + '</a>';
        });

        content.innerHTML = html;
        window.scrollTo(0, 0);
        closeSidebar();
    }

    /* ---------- routing ---------- */

    var DEFAULT_PAGE = roots.length ? roots[0] : null;

    function route() {
        var h = decodeURIComponent(location.hash || '');
        if (h.indexOf('#search=') === 0) {
            renderSearch(h.slice(8));
        } else if (h.indexOf('#/') === 0) {
            renderPage(h.slice(2));
        } else if (DEFAULT_PAGE) {
            renderPage(DEFAULT_PAGE);
        }
    }

    window.addEventListener('hashchange', route);

    /* ---------- sidebar search + mobile menu ---------- */

    document.getElementById('navSearch').addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && this.value.trim()) {
            location.hash = '#search=' + encodeURIComponent(this.value.trim());
        }
    });

    var sidebar = document.getElementById('sidebar');
    document.getElementById('menuToggle').addEventListener('click', function () {
        sidebar.classList.toggle('is-open');
    });
    function closeSidebar() { sidebar.classList.remove('is-open'); }

    route();
})();
</script>
</body>
</html>
